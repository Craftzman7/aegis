title: Dynamic Linker Preload File Modified
id: 33d20a52-ba56-4120-b564-79f66ec1fbc0
status: stable
description: Detects changes to /etc/ld.so.preload, used by userland rootkits to inject a shared object into every process.
author: Aegis
date: 2026/11/01
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.defense_evasion
    - attack.t1574.006
logsource:
    product: linux
    category: file_event
detection:
    selection:
        TargetFilename: '/etc/ld.so.preload'
    condition: selection
falsepositives:
    - Legitimate use of libraries such as libfaketime or profiling tools
level: high
