title: SSH authorized_keys File Modified
id: 8aba1dfe-5053-4484-a94e-9189929171d0
status: stable
description: Detects creation or modification of an authorized_keys file, a frequent SSH persistence mechanism.
author: Aegis
date: 2026/11/01
tags:
    - attack.persistence
    - attack.t1098.004
logsource:
    product: linux
    category: file_event
detection:
    selection:
        TargetFilename|endswith:
            - '/authorized_keys'
            - '/authorized_keys2'
    condition: selection
falsepositives:
    - Administrators or configuration management (Ansible, cloud-init) provisioning keys
level: high
